  <script>
    // Invalida o cache do service worker uma vez por build. Sem isso, quem já
    // visitou o site pode receber o social.js antigo no primeiro carregamento
    // após o deploy e ver "sala privada" mesmo com o link novo.
    (async () => {
      const build = "w00-v26";
      const key = "w00filmes.build";
      try {
        if (localStorage.getItem(key) === build) return;
        if (!navigator.onLine) return;
        localStorage.setItem(key, build);
        if (!navigator.serviceWorker?.controller || !("caches" in window)) return;
        const keys = await caches.keys();
        await Promise.all(keys.map((name) => caches.delete(name)));
        location.reload();
      } catch {}
    })();
  </script>
